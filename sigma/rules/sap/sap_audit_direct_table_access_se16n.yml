logsource:
  category: sap
  product: netweaver
detection:
  selection:
    event_type: transaction_start
    tcode: SE16N
  falsepositives:
  - Functional consultants analysing data tables during implementation
  - Approved data investigation following an incident
  - Integration or migration work using SE16N for data upload
  level: high
  condition: selection